<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Hub | Sports Academy Swish NorCal Jr EYBL 14U</title>
<meta name="apple-mobile-web-app-title" content="Swish Hub">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0F">
<meta name="description" content="Tournament calendar, gyms, hotels, game schedules, travel times and game film for Sports Academy Swish NorCal Jr EYBL 14U.">
<meta property="og:title" content="Swish Team Hub">
<meta property="og:description" content="One place for every tournament: gyms, hotels, schedules, travel times and game film.">
<meta property="og:image" content="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
:root{
  --paper:#F6F7F5; --card:#FFFFFF; --ink:#1B1F2A; --muted:#5E6472; --line:#DCDDD8;
  --maple:#E2AE5E; --maple-dark:#B9803A; --blue:#1F4FD1; --blue-soft:#E6ECFB; --live:#16864E;
  --danger:#B42318;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11141B; --card:#1A1E28; --ink:#ECEEF2; --muted:#9CA3B0; --line:#2C3240;
    --maple:#D9A456; --maple-dark:#F0C07A; --blue:#7B9BFF; --blue-soft:#1F2A4A; --live:#3CC482; --danger:#FF7A6E;
  }
}
:root[data-theme="dark"]{
  --paper:#11141B; --card:#1A1E28; --ink:#ECEEF2; --muted:#9CA3B0; --line:#2C3240;
  --maple:#D9A456; --maple-dark:#F0C07A; --blue:#7B9BFF; --blue-soft:#1F2A4A; --live:#3CC482; --danger:#FF7A6E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--blue)}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 48px}
.display{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.005em;line-height:1.02}

/* Court hero */
.court{position:relative;margin:0 -16px;padding:22px 20px 26px;color:#23180A;
  background:
    repeating-linear-gradient(90deg,rgba(120,70,20,.10) 0 2px,transparent 2px 46px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,transparent 1px 11px),
    linear-gradient(180deg,#EDBE72,#DDA553);
  overflow:hidden}
.court::after{content:"";position:absolute;right:-70px;bottom:-70px;width:200px;height:200px;border:3px solid rgba(255,255,255,.75);border-radius:50%}
.court::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.75)}
.teamline{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600;font-size:15px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.badge{display:grid;place-items:center;width:72px;height:80px;border-radius:12px;background:#0D0D0F;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.badge img{width:56px;height:auto;display:block}
.brand .lbl{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:700;line-height:1.05}
.teamline .season{opacity:.75}
.court h1{font-size:clamp(38px,10vw,56px);margin:14px 0 6px;max-width:15ch}
.court .when{font-size:17px;font-weight:500}
.count{display:flex;align-items:baseline;gap:8px;margin-top:14px;position:relative;z-index:1}
.count b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:64px;line-height:.9}
.count span{font-size:17px;font-weight:600}
.pill-live{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--live);border-radius:999px;padding:6px 14px;font-weight:700}
.pill-live i{width:9px;height:9px;border-radius:50%;background:#16864E}
.court .open{margin-top:16px;position:relative;z-index:1;display:inline-block;background:#23180A;color:#FBE3BC;border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer;text-decoration:none}

/* Quick links */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0 8px}
.quick a{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);min-height:64px}
.quick a small{color:var(--muted);font-size:13px}
.quick a strong{font-weight:600}

h2.sec{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:28px;margin:28px 0 10px;font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.trow{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;padding:12px 14px;text-decoration:none;color:var(--ink)}
.plan{font-size:14px;margin-top:3px;font-weight:600;color:var(--ink)}
.plan.warn{color:var(--danger)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 12px 106px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media (max-width:420px){.chips{padding-left:14px}}
.chip{flex:none;display:inline-flex;align-items:center;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.chip.key{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.off{color:var(--muted);border-style:dashed;background:transparent}
.date{text-align:center;border-right:1px solid var(--line);padding-right:12px}
.date .m{font-size:13px;color:var(--muted);font-weight:600}
.date .d{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:28px;font-weight:700;line-height:1;white-space:nowrap}
.date .w{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.trow .name{font-weight:600;font-size:17px;line-height:1.25}
.trow .sub{color:var(--muted);font-size:14px}
.tag{font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.tag.live{background:var(--live);color:#fff}
.tag.soon{background:var(--blue-soft);color:var(--blue)}
.tag.film{background:transparent;color:var(--muted);border:1px solid var(--line)}
.tags{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tag.travel{background:var(--maple);color:#23180A}
.tag.local{background:transparent;color:var(--ink);border:1px solid var(--line)}
.filters{display:flex;gap:6px;margin:0 0 12px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;min-height:38px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stay{margin-top:10px;position:relative;z-index:1;font-size:16px;font-weight:500}
.stay b{font-weight:700}
.field select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;font-size:16px}
.where{margin-top:12px;position:relative;z-index:1;font-size:17px}
.where b{font-weight:700}
.heroacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;position:relative;z-index:1;max-width:520px}
@media (min-width:560px){.heroacts{grid-template-columns:repeat(4,1fr)}}
.hbtn.off{background:rgba(35,24,10,.18);color:rgba(35,24,10,.7);cursor:default}
.hbtn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:10px;background:#23180A;color:#FBE3BC;font-weight:600;text-decoration:none}
.hbtn.alt{background:rgba(255,255,255,.55);color:#23180A}
.gameday .bracket{display:flex;width:100%;margin-top:4px}
.gameday .venue{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
details.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto 20px;gap:12px;align-items:center;padding:12px 16px;min-height:60px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";font-size:22px;font-weight:600;color:var(--muted);text-align:center}
details.acc[open]>summary::after{content:"–"}
details.acc[open]>summary{border-bottom:3px solid var(--maple)}
.acc .st{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:23px;font-weight:700}
.acc .ss{color:var(--muted);font-size:14px;text-align:right}
.acc .item:first-of-type{border-top:0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:8px;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.dock a{flex:1;max-width:210px}
.wrap.has-dock{padding-bottom:120px}
.eyebrow{position:relative;z-index:1;display:inline-block;margin-top:16px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#23180A;color:#FBE3BC;padding:4px 10px;border-radius:6px}
.eyebrow + h1{margin-top:8px}
.srcs{display:flex;flex-wrap:wrap;gap:8px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted)}

/* Detail */
.back{display:inline-flex;align-items:center;gap:6px;margin:16px 0 4px;background:none;border:0;color:var(--blue);font-weight:600;padding:8px 0;cursor:pointer}
.dhead h1{font-size:clamp(34px,9vw,48px);margin:6px 0 4px}
.dhead .meta{color:var(--muted);font-size:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:11px 16px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer;min-height:44px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.block{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
.block h3{margin:0;padding:14px 16px 10px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;font-weight:700;border-bottom:3px solid var(--maple)}
.item{padding:14px 16px;border-top:1px solid var(--line)}
.block h3 + .item{border-top:0}
.item .t{font-weight:600;font-size:17px}
.item .s{color:var(--muted);font-size:15px}
.vday{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--maple-dark);background:color-mix(in srgb,var(--maple) 20%,transparent);border-radius:6px;padding:2px 8px;margin-bottom:4px}
.item .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin-top:8px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.game{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.notes{white-space:pre-wrap}

/* Editor */
.sheet{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.panel{background:var(--paper);width:100%;max-width:680px;height:100%;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
@media (min-width:720px){.sheet{align-items:center}.panel{height:92%;border-radius:16px}}
.panel h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:30px;margin:4px 0 12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;font-size:16px}
.field textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 14px}
legend{font-weight:700;padding:0 6px}
.grp-row{border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.grp-row:first-of-type{border-top:0;padding-top:0}
.help{color:var(--muted);font-size:14px;margin:-4px 0 12px}
.bar{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;background:var(--paper);padding:12px 0 0;border-top:1px solid var(--line);margin-top:8px}
.foot{margin-top:36px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot button{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;padding:6px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;max-width:90vw}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.panel{animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* Trip label: text, not a button */
.trip{display:block;margin-top:6px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.trip.travel{color:var(--maple-dark)}
.dhead .trip{display:inline}
/* Larger, phone-friendly type */
body{font-size:17px}
.trow{grid-template-columns:86px 1fr auto;padding:14px 14px}
.date .m,.date .w{font-size:14px}
.date .d{font-size:31px}
.trow .name{font-size:19px;line-height:1.2}
.trow .sub{font-size:15.5px}
.plan{font-size:15.5px}
.tag{font-size:14px;padding:4px 11px}
.chips{padding-left:114px}
.chip{font-size:15px;min-height:40px;padding:0 15px}
.court .when,.where{font-size:18px}
.teamline{font-size:16px}
.hbtn{font-size:16.5px;min-height:50px}
.count span{font-size:18px}
.quick a strong{font-size:17px}.quick a small{font-size:14.5px}
h2.sec{font-size:31px}
.filters button{font-size:16px;min-height:42px;padding:7px 16px}
.dhead .meta{font-size:17.5px}
.item .t{font-size:18.5px}.item .s{font-size:16px}.kv{font-size:16px}
.btn{font-size:16.5px;min-height:48px}
.acc .st{font-size:25px}.acc .ss{font-size:15.5px}
.block h3{font-size:26px}
.foot{font-size:15px}
@media (max-width:420px){
  .wrap{padding-left:14px;padding-right:14px}
  .court{margin:0 -14px}
  .trow{grid-template-columns:74px 1fr auto;gap:12px;padding:14px 12px}
  .date{padding-right:10px}
  .date .d{font-size:28px}
  .chips{padding-left:12px}
  .court h1{font-size:44px}
}

.date .m,.date .w{white-space:nowrap}
.chips{flex-wrap:wrap;overflow:visible}
.teamline .season{white-space:nowrap;text-align:right}
@media (max-width:420px){.trow{grid-template-columns:84px 1fr auto}.date .m,.date .w{font-size:13.5px}.date .d{font-size:27px}}

.brandbar{display:flex;align-items:center;gap:14px;margin:0 -16px;padding:14px 16px;background:#0D0D0F;color:#fff;border-bottom:4px solid var(--maple)}
.brandbar .badge{width:60px;height:66px;box-shadow:none;border:1px solid rgba(255,255,255,.18)}
.brandbar .badge img{width:46px}
.brandbar .lbl{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:28px;font-weight:700;line-height:1}
.brandbar .season{font-size:15px;color:rgba(255,255,255,.72);margin-top:3px}
.tag.next{background:var(--ink);color:var(--paper)}
.dock .btn{font-size:15px;padding:0 8px;min-height:48px}
@media (max-width:420px){.brandbar{margin:0 -14px;padding:12px 14px}}

.nextup{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:5px;margin-bottom:5px}
.brandbar .badge{width:74px;height:82px}.brandbar .badge img{width:58px}
.brandbar .org{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--maple);margin-bottom:3px}

.date .y{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;display:inline-block;padding:0 6px;margin-bottom:4px}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:16px -16px 14px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:700;text-decoration:none;color:var(--muted);background:var(--card);border:1px solid var(--line)}
.tabs a span{font-family:Barlow,system-ui,sans-serif;font-size:14px;font-weight:700;background:var(--paper);border-radius:999px;padding:1px 9px}
.tabs a[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs a[aria-selected="true"] span{background:var(--maple);color:#23180A}
h3.yr{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px;margin:18px 0 8px;padding-bottom:4px;border-bottom:3px solid var(--maple);display:inline-block}
@media (max-width:420px){.tabs{margin-left:-14px;margin-right:-14px;padding:10px 14px}}

.date .m{font-size:17px;font-weight:700;color:var(--ink)}
@media (max-width:420px){.date .m{font-size:16px}}
.opps{margin-top:6px;font-size:15.5px;line-height:1.45;color:var(--ink)}
.opps span{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.opps b{font-weight:700;color:var(--muted);margin-left:4px}

.hotelbox{margin-top:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--maple) 16%,var(--card));border-left:4px solid var(--maple);display:flex;flex-direction:column;gap:1px}
.hotelbox .hk{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--maple-dark)}
.hotelbox .hn{font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.3}
.hotelbox .hr,.hotelbox .hw{font-size:14.5px;color:var(--muted)}
.hotelbox.none{background:transparent;border:1px dashed var(--line);border-left:4px solid var(--line)}
.hotelbox.none .hk{color:var(--muted)}.hotelbox.none .hn{color:var(--muted);font-weight:500}
.hotelbox.warn{border-left-color:var(--danger)}.hotelbox.warn .hw{color:var(--danger);font-weight:700}
.chip.off,.btn.off{background:var(--line);border:1px solid var(--line);color:var(--muted);cursor:not-allowed;opacity:.75}
.dock .btn{white-space:normal;text-align:center;line-height:1.1}

/* ---- Mobile polish: bigger type, obvious tap targets ---- */
body{font-size:18px}
.hint{margin:0 0 12px;color:var(--muted);font-size:16px}
.tcard{box-shadow:0 1px 0 rgba(0,0,0,.04),0 4px 14px rgba(20,22,30,.06);border-radius:16px;transition:transform .12s ease}
.tcard.is-next{border:2px solid var(--maple)}
.trow{grid-template-columns:88px 1fr 22px;padding:16px 14px 12px}
.trow .name{font-size:21px;line-height:1.2}
.trow .sub{font-size:16.5px}
.plan,.opps{font-size:16.5px}
.date .y{font-size:13px}.date .m{font-size:18px}.date .d{font-size:32px}.date .w{font-size:15px}
.trip{font-size:13.5px}
.tags{align-self:stretch;justify-content:space-between}
.chev{font-size:32px;line-height:1;color:var(--muted);margin-top:auto}
.nextup{font-size:13px}
.hotelwrap{padding:0 14px 12px 116px}
.hotelbox{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;margin:0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--maple) 16%,var(--card));border-left:4px solid var(--maple)}

function firstVenue(t){return (t.venues||[]).find(v=>v.name||v.address);}
function venueMap(v){return maps(((v.name||'')+' '+(v.address||'')).trim());}
function allVenues(t){return (t.venues||[]).filter(v=>v.name||v.address);}
function dayTag(v){return v&&v.day?`<span class="vday">${esc(v.day)}</span>`:'';}
function noGH(t){return t.groupHotel==='none';}
function ghTBD(t){return t.groupHotel==='tbd';}
function firstHotel(t){return (noGH(t)||ghTBD(t))?null:(t.hotels||[]).find(h=>h.name||h.url);}
let artifactNs = null, canEdit = false, readOnly = false, sheet = null;
const root = document.getElementById('root');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(u){u=(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; try{const x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:'';}catch(e){return '';}}
function maps(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function parseD(s){if(!s) return null; const [y,m,d]=s.split('-').map(Number); return (y&&m&&d)?new Date(y,m-1,d):null;}
function today(){const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtRange(a,b){const s=parseD(a), e=parseD(b)||s; if(!s) return 'Dates TBD';
  const opt={weekday:'short',month:'short',day:'numeric'};
  const optY={...opt,year:'numeric'};
  if(+s===+e) return s.toLocaleDateString(undefined,optY);
  return s.toLocaleDateString(undefined,s.getFullYear()===e.getFullYear()?opt:optY)+' – '+e.toLocaleDateString(undefined,optY);}
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function dateBox(t){const s=parseD(t.start), e=parseD(t.end)||s; if(!s) return '<div class="m">TBD</div><div class="d">?</div>';
  const same=+s===+e, sameMon=s.getMonth()===e.getMonth();
  const mon=same||sameMon?MON[s.getMonth()]:MON[s.getMonth()]+'–'+MON[e.getMonth()];
  const days=same?String(s.getDate()):s.getDate()+'–'+e.getDate();
  const dow=same?DOW[s.getDay()]:DOW[s.getDay()]+'–'+DOW[e.getDay()];
  const yr=s.getFullYear()===e.getFullYear()?String(s.getFullYear()):s.getFullYear()+'–'+String(e.getFullYear()).slice(2);
  return `<div class="cardcal"><div class="m${mon.includes('–')?' long':''}">${mon}</div><div class="d">${days}</div><div class="w">${dow}</div></div><div class="y">${yr}</div>`;}
function status(t){const s=parseD(t.start), e=parseD(t.end)||s, n=today(); if(!s) return {k:'tbd'};
  if(n<s) return {k:'up',days:Math.round((s-n)/864e5)}; if(n<=e) return {k:'live'}; return {k:'past'};}
function sorted(){return [...state.tournaments].sort((a,b)=>(a.start||'9999').localeCompare(b.start||'9999'));}

function toast(msg,ms){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2400);}

/* ---------- Views ---------- */
function linkTile(label,sub,url){const u=safeUrl(url); return u?`<a href="${esc(u)}" target="_blank" rel="noopener"><strong>${esc(label)}</strong><small>${esc(sub)}</small></a>`:'';}

function srcName(u){try{const h=new URL(u).hostname.replace(/^www\./,'');
  const map=[['exposureevents','Exposure Events'],['tourneymachine','Tourney Machine'],['leagueapps','LeagueApps'],['hypeherhoops','Hype Her Hoops'],['selectevents','Select Events'],['basketballtournaments','Basketball Tournaments'],['sportsengine','SportsEngine'],['google.','Google'],['nike','Nike EYBL'],['3ssb','3SSB']];
  const f=map.find(([k])=>h.includes(k)); return f?f[1]:h;}catch(e){return 'the tournament site';}}
function linksOf(v){return String(v||'').split(/\n|,(?=\s*(?:[^|,]*\|\s*)?https?:)/).map(x=>x.trim()).filter(Boolean).map(x=>{const h=x.search(/https?:\/\//i); let lab='', raw=x; if(h>0){lab=x.slice(0,h).replace(/[\s|:–—-]+$/,'').trim(); raw=x.slice(h);} else {const i=x.lastIndexOf('|'); if(i>0){lab=x.slice(0,i).trim(); raw=x.slice(i+1);}} const u=safeUrl(raw.trim().split(/\s+/)[0]); return u?{label:lab,url:u}:null;}).filter(Boolean);}
function tDays(t){const a=parseD(t.start), b=parseD(t.end)||a, out=[]; if(!a) return out; for(let d=new Date(a);d<=b&&out.length<7;d.setDate(d.getDate()+1)) out.push(d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'})); return out;}
function filmTitles(t,arr){const days=tDays(t); return arr.map((x,i)=>x.label||(arr.length===days.length&&arr.length>1?days[i]:arr.length===1?'':'Part '+(i+1)));}
function filmBlock(t,kind){
  const arr=linksOf(t[kind]); if(!arr.length) return '';
  const ttl=filmTitles(t,arr), yt=kind==='playlist';
  const head=`<div class="fhead">${ic(yt?'play':'photo')}<span>${yt?'Full games':'Short clips'}</span><small>${yt?'YouTube':'Google Photos'}</small></div>`;
  return head+arr.map((x,i)=>`<a class="frow ${yt?'yt':'gp'}" href="${esc(x.url)}" target="_blank" rel="noopener"><span class="ft"><b>${esc(ttl[i]||(yt?'All games from this tournament':'All clips from this tournament'))}</b>${!ttl[i]&&yt&&+t.played?`<small>${t.played} game${+t.played>1?'s':''}</small>`:''}</span><span class="fgo">${yt?'Watch':'View'} ›</span></a>`).join('');
}
function firstLink(v){const l=linksOf(v); return l.length?l[0].url:'';}
function conf(t){return t.confirmed==='tentative'?'tentative':'confirmed';}
function cbadge(t){const c=conf(t); return `<span class="cbadge ${c}">${c==='tentative'?'Tentative':'Confirmed'}</span>`;}
function updStrip(){const u=state.updatedAt?new Date(state.updatedAt):null; if(!u||isNaN(u)) return '';
  const d=u.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}), tm=u.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  return `<div class="updstrip"><span class="ul">Last updated</span><span class="ud">${esc(d)} · ${esc(tm)}</span></div>`;}
function tentNote(list){const tt=list.filter(t=>conf(t)==='tentative'); if(!tt.length) return '';
  return `<div class="tent">${ic('alert')}<span><b>Tentative tournaments:</b> please don’t book travel or hotels yet. Wait for an update from Coach.<small>${tt.map(t=>esc(t.name||'Tournament')+' ('+esc(MON[parseD(t.start).getMonth()]+' '+parseD(t.start).getDate())+')').join(' · ')}</small></span></div>`;}
function chkItems(t){return String(t.checklist||'').split('\n').map(x=>x.replace(/^\s*(\d+[.)]|[-*•])\s*/,'').trim()).filter(Boolean).map(x=>{const o=/^optional\s*[:\-–]\s*/i.test(x); return {opt:o,text:o?x.replace(/^optional\s*[:\-–]\s*/i,''):x};});}
function chkKey(t,i,txt){return 'hub-chk:'+t.id+':'+i+':'+txt.length;}
function outOfState(t){const c=String(t.city||'').trim(); if(!c) return false; const m=c.match(/,\s*([A-Za-z]{2})\.?\s*$/); if(m) return m[1].toUpperCase()!=='CA'; return !/\b(CA|California)\b/i.test(c);}
function tplKind(t){const o=t.chkTpl||'auto'; if(o!=='auto') return o; if(tripOf(t)!=='travel') return 'none'; return outOfState(t)?'fly':'drive';}
const CHK_TPL={fly:['Book flight','Book hotel'],drive:['Book hotel'],none:[]};
function tplItems(t){if(conf(t)==='tentative') return []; return (CHK_TPL[tplKind(t)]||[]).map(x=>({opt:false,text:x,key:'hub-chk:'+t.id+':tpl:'+x}));}
function checklist(t,compact){const it=[...tplItems(t),...chkItems(t).map((x,i)=>Object.assign({},x,{key:chkKey(t,i,x.text)}))]; if(!it.length||status(t).k==='past') return '';
  let st={}; it.forEach((x,i)=>{try{st[i]=localStorage.getItem(x.key)==='1';}catch(e){}});
  const done=it.filter((x,i)=>st[i]).length;
  return `<div class="chk${compact?' compact':''}"><div class="chkh">${ic('check')}<b>Before you go</b><small>${done} of ${it.length} done</small></div>
    ${it.map((x,i)=>`<label class="chki${st[i]?' done':''}"><input type="checkbox" data-chk="${esc(x.key)}" ${st[i]?'checked':''}><span>${x.opt?'<em>Optional</em> ':''}${esc(x.text)}</span></label>`).join('')}
    <div class="chkn">Checkmarks are saved on your phone only.</div></div>`;}
function rsvpNote(){const la=safeUrl(state.links.leagueapps);
  return `<div class="rsvp">${ic('check')}<span><b>Player availability (RSVP)</b> is done in LeagueApps, not in this hub.</span>${la?`<a href="${esc(la)}" target="_blank" rel="noopener">Open</a>`:''}</div>`;}
function upd(){const u=state.updatedAt?new Date(state.updatedAt):null; return u&&!isNaN(u)?u.toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';}
function recordOf(t){const gs=t.games||[]; const w=gs.filter(g=>/^w/i.test(g.result||'')).length, l=gs.filter(g=>/^l/i.test(g.result||'')).length; return (w+l)?w+'–'+l:'';}
function gameCount(t){const gs=t.games||[]; return Math.max(gs.filter(g=>g.opponent).length,+t.played||0,gs.filter(hasFilm).length);}

function a2hs_claude(){
  let hide=false; try{hide=localStorage.getItem('hub-a2hs')==='1';}catch(e){}
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  if(hide||standalone||window.innerWidth>760) return '';

}
function statusCard(all,past){
  const nx=all.find(t=>status(t).k==='live')||all.find(t=>status(t).k==='up');
  const recent=past.find(t=>{const e=parseD(t.end)||parseD(t.start); return e&&(today()-e)/864e5<=14&&(firstLink(t.playlist)||(t.games||[]).some(hasFilm));});
  let main='';
  if(nx){ const st=status(nx), v=firstVenue(nx), info=safeUrl(nx.info), h=firstHotel(nx), hu=h&&!pend(nx)&&safeUrl(h.url), bb=bookBy(nx), trip=tripOf(nx);
    const gw=st.k==='live'||st.days<=7;
    const kick=st.k==='live'?'Happening now':st.days===0?'Today':st.days===1?'Tomorrow':gw?'This week':'Next up';
    const when=st.k==='live'?'Live now':st.days===0?'Tip-off today':st.days===1?'Tip-off tomorrow':'In '+st.days+' days';
    let line;
    const nvs=allVenues(nx);
    if(gw) line=nvs.length>1?'At '+nvs.map(x=>`<b>${esc(x.name||x.address)}</b>${x.day?' ('+esc(x.day)+')':''}`).join(' &amp; '):v?`At <b>${esc(v.name||v.address)}</b>`:'Gym to be announced';
    else if(trip==='travel') line=h?(booked(h)?`Group hotel: <b>${esc(h.name||'hotel')}</b>. Group booking not available`:`Group hotel: <b>${esc(h.name||'room block')}</b>${pend(nx)?'. Booking opens once confirmed':bb&&bb.days!=null&&bb.days>=0?', book by '+esc(bb.text):''}`):(noGH(nx)?'Travel event. No group hotel.<i class="fam">Each family can choose their own.</i>':'Travel event. Group hotel: TBD.');
    else line=v?`Local event at <b>${esc(v.name||v.address)}</b>`:'Local event';
    const btn=(href,label,icn,primary,ext)=>`<a class="sbtn${primary?' pri':''}" href="${esc(href)}"${ext?' target="_blank" rel="noopener"':''}>${ic(icn)}${label}</a>`;
    const btns=gw?[nvs.length>1?btn('#t/'+nx.id,'Gym directions','pin',true,0):v?btn(venueMap(v),'Directions','pin',true,1):'',info?btn(info,'Game Schedule','cal',!v,1):'',nvs.length>1?'':btn('#t/'+nx.id,'Details','arrow',false,0)]
      :[trip==='travel'&&hu?btn(hu,'Book hotel','bed',true,1):'',btn('#t/'+nx.id,'Details','arrow',!(trip==='travel'&&hu),0)];
    main=`<div class="skick">${kick}${cbadge(nx)}</div><div class="sname">${esc(nx.name)}</div>
      <div class="swhen">${esc(when)} · ${esc(fmtRange(nx.start,nx.end))}${nx.city?', '+esc(nx.city):''}</div>
      <div class="sline">${line}</div><div class="sbtns">${btns.join('')}</div>`;
  } else main=`<div class="skick">Next up</div><div class="sname">No tournaments booked yet</div><div class="swhen">Check back soon.</div>`;
  let film='';
  if(recent){ const pl=firstLink(recent.playlist), n=gameCount(recent), r=recordOf(recent);
    film=`<div class="sfilm"><div class="skick">Past event</div><div class="pname">${esc(recent.name)}</div><div class="swhen">${esc(fmtRange(recent.start,recent.end))}${recent.city?', '+esc(recent.city):''}</div><div class="prow">${ic('play')}<span>Film is up${n?`: ${n} games${r?', '+r+' record':''}`:''}</span><a href="${esc(pl||'#t/'+recent.id)}"${pl?' target="_blank" rel="noopener"':''}>Watch</a></div></div>`; }
  return `<section class="status" aria-label="What's next">${main}${film}</section>`;
}
function attention(all){
  const items=[]; const la=safeUrl(state.links.leagueapps);
  all.filter(t=>['live','up'].includes(status(t).k)).forEach(t=>{const st=status(t), h=firstHotel(t), hu=h&&safeUrl(h.url), bb=bookBy(t), info=safeUrl(t.info), nm=t.name||'Tournament';
    if(tripOf(t)==='travel'&&h&&st.k==='up'&&!pend(t)){
      if(bb&&bb.days!=null){ if(bb.days>=0) items.push({u:bb.days<=7?2:1,d:bb.days,t:`Book your hotel for <b>${esc(nm)}</b> by ${esc(bb.text)}`+(bb.days<=14?` <span class="due">${bb.days===0?'today':bb.days+' day'+(bb.days>1?'s':'')+' left'}</span>`:''),href:hu||'#t/'+t.id,ext:!!hu,cta:'Book'}); }
      else items.push({u:1,d:st.days,t:`Hotel posted for <b>${esc(nm)}</b>. Book your room.`,href:hu||'#t/'+t.id,ext:!!hu,cta:'Book'});
    }
    if(st.k==='live'||st.days<=14){
      if(info) items.push({u:1,d:st.days||0,t:`Game schedule is posted for <b>${esc(nm)}</b>`,href:info,ext:true,cta:'View'});
      else items.push({u:0,d:st.days||0,t:`Game schedule for <b>${esc(nm)}</b> isn't posted yet`,info:1});
    }
    if(la&&st.k==='up'&&st.days<=21) items.push({u:1,d:st.days,t:`RSVP for <b>${esc(nm)}</b> in LeagueApps`,href:la,ext:true,cta:'RSVP'});
  });
  items.sort((a,b)=>b.u-a.u||a.d-b.d);
  const list=items.slice(0,4);
  return `<section class="attn" aria-label="Needs your attention"><h2>${ic('alert')}Needs your attention</h2>
    ${list.length?list.map(i=>`<div class="aitem${i.u===2?' urgent':''}${i.info?' info':''}"><span>${i.t}</span>${i.href?`<a href="${esc(i.href)}"${i.ext?' target="_blank" rel="noopener"':''}>${i.cta}</a>`:''}</div>`).join(''):'<div class="aitem info"><span>You’re all caught up. Nothing to do right now.</span></div>'}
  </section>`;
}
function launcher(all,past){
  const L=state.links; const la=safeUrl(L.leagueapps), gm=safeUrl(L.groupme);
  const hotels=all.filter(t=>status(t).k==='up'&&tripOf(t)==='travel'&&firstHotel(t)).length;
  const lastFilm=past.find(t=>firstLink(t.playlist)||(t.games||[]).some(hasFilm));
  const tile=(href,icn,title,sub,ext)=>href?`<a class="ltile" href="${esc(href)}"${ext?' target="_blank" rel="noopener"':''}>${ic(icn)}<b>${title}</b><small>${sub}</small></a>`:`<span class="ltile off">${ic(icn)}<b>${title}</b><small>Link coming soon</small></span>`;
  return `<section class="launch" aria-label="Where things live"><h2>Where things live</h2><div class="lgrid">
    ${tile(la,'check','Game times &amp; RSVPs','Opens LeagueApps',1)}
    ${tile(gm,'chat','Team chat','Opens GroupMe',1)}
    ${tile('#cal','cal','Tournament calendar','In this hub',0)}
    ${tile('#past','play','Game film',lastFilm?'Latest: '+esc(lastFilm.name):'Every tournament',0)}
    ${tile('#hotels','bed','Hotels',hotels?hotels+' room block'+(hotels>1?'s':'')+' posted':'None posted yet',0)}
  </div></section>`;
}
function snapshot(all,past){
  const ups=all.filter(t=>['live','up','tbd'].includes(status(t).k));
  const nc=ups.filter(t=>conf(t)==='confirmed').length, nt=ups.length-nc;
  const trav=ups.filter(t=>tripOf(t)==='travel'), hp=trav.filter(t=>firstHotel(t)).length;
  const filmT=past.filter(t=>firstLink(t.playlist)||(t.games||[]).some(hasFilm)).length;
  const tile=(href,icn,title,big,sub)=>`<a class="ltile" href="${href}">${ic(icn)}<b>${title}</b><span class="big">${big}</span><small>${sub}</small></a>`;
  return `<section class="launch" aria-label="Snapshot"><h2>At a glance</h2><div class="lgrid snap">
    ${tile('#cal','cal','Schedule',ups.length+' upcoming',`${nc} confirmed${nt?', '+nt+' tentative':''}`)}
    ${tile('#hotels','bed','Travel hotels',hp+' of '+trav.length+' posted',trav.length?trav.length+' travel tournament'+(trav.length>1?'s':''):'No travel coming up')}
    ${tile('#past','play','Game film',filmT+' tournaments',past[0]?'Latest: '+esc(past[0].name):'None yet')}
  </div></section>`;
}
function hotelsBody(){
  const ups=sorted().filter(t=>status(t).k!=='past'&&tripOf(t)==='travel');
  if(!ups.length) return '<div class="empty">No travel tournaments coming up.</div>';
  return `<div class="clist">${ups.map(t=>{const h=firstHotel(t), u=h&&safeUrl(h.url), bb=bookBy(t);

/* ---------- Saving (publishes a new version of this page) ---------- */
function buildDoc(s){
  const css=document.getElementById('css').textContent;
  const app=document.getElementById('app').textContent;
  const json=JSON.stringify(s).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="en">\n<head>\n'+HEAD('Team Hub | '+(s.team&&s.team.name?s.team.name:'Team'))+'\n<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="data">'+json+'<\/script>\n<script id="app">'+app+'<\/script>\n</body>\n</html>\n';
}
async function persist(next){
  if(!artifactNs){toast('Saving works when the hub is opened in Claude.');return false;}
  toast('Publishing…',6000);
  next.updatedAt=new Date().toISOString();
  try{ await artifactNs.publish(buildDoc(next)); state=next; return true; }
  catch(err){const c=err&&err.code;
    if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){readOnly=true;canEdit=false;closeSheet();render();toast('You don’t have edit access. Ask the hub owner to add you as an editor.',4000);}
    else if(c==='conflict'){toast('Someone else just updated the hub. Reloading.');}
    else if(c==='rate_limited'){toast('Saving too often. Wait a moment and try again.');}
    else if(c==='too_large'){toast('The hub is too large to save.');}
    else {toast('Couldn’t publish. Try again.');}
    return false;}
}

function summary(t){const lines=[t.name, fmtRange(t.start,t.end)+(t.city?', '+t.city:'')];
  ((noGH(t)||ghTBD(t))?[]:(t.hotels||[])).forEach(h=>{lines.push('','Hotel: '+(h.name||'')); if(h.address) lines.push(h.address); if(h.code) lines.push('Block/code: '+h.code); if(h.rate) lines.push('Rate: '+h.rate); if(h.deadline) lines.push('Book by: '+h.deadline); if(safeUrl(h.url)&&!pend(t)) lines.push('Book: '+safeUrl(h.url));});
  (t.venues||[]).forEach(v=>{lines.push('','Gym'+(v.day?' ('+v.day+')':'')+': '+(v.name||'')); if(v.address) lines.push(v.address);});
  lines.splice(1,0,'Status: '+(conf(t)==='tentative'?'Tentative':'Confirmed'));
  if(safeUrl(t.info)) lines.push('','Game schedule: '+safeUrl(t.info));
  if(safeUrl(t.site)) lines.push('','Event site: '+safeUrl(t.site));
  linksOf(t.playlist).forEach(x=>lines.push('','Game film (YouTube)'+(x.label?' – '+x.label:'')+': '+x.url));
  linksOf(t.clips).forEach(x=>lines.push('','Short clips (Google Photos)'+(x.label?' – '+x.label:'')+': '+x.url));
  if(safeUrl(t.statsnerd)) lines.push('','Game film (StatsNerd): '+safeUrl(t.statsnerd));
  lines.push('','Game times and RSVPs are in LeagueApps.');
  if(location.href.startsWith('http')) {}
  return lines.join('\n');}

  document.title=(t?t.name+' | ':'')+'Team Hub';
}

  if(act==='filter'){tripFilter=b.dataset.k;render();return;}
  if(act==='bulk'){const ta=sheet.querySelector('#bulk'); const rows=sheet.querySelector('[data-grp="games"] .rows'); let n=0;
    ta.value.split(/\n+/).forEach(line=>{const m=line.match(/https?:\/\/\S+|(?:www\.)?youtu(?:be\.com|\.be)\/\S+/i); if(!m) return;
      const label=line.replace(m[0],'').replace(/^[\s\-–:|,]+|[\s\-–:|,]+$/g,'').replace(/^vs\.?\s+/i,'');
      rows.insertAdjacentHTML('beforeend',grpRow('games',{url:m[0],opponent:label})); n++;});
    ta.value=''; toast(n?('Added '+n+' game'+(n>1?'s':'')+'. Fill in results if you like.'):'No links found. Paste one YouTube link per line.'); return;}
  if(act==='organizer'){canEdit=true;render();toast('Editing on. Saves only go through for admins with edit access.',3500);return;}
  if(act==='new'){openSheet(tournamentForm());return;}
  if(act==='settings'){openSheet(settingsForm());return;}
  if(act==='edit'){openSheet(tournamentForm(state.tournaments.find(x=>x.id===id)));return;}
  if(act==='close'){closeSheet();return;}
  if(act==='addrow'){const fs=b.closest('fieldset'); fs.querySelector('.rows').insertAdjacentHTML('beforeend',grpRow(b.dataset.g)); const rows=fs.querySelectorAll('.grp-row'); const inp=rows[rows.length-1].querySelector('input'); if(inp) inp.focus(); return;}
  if(act==='rmrow'){b.closest('.grp-row').remove();return;}
  if(act==='copy'){const t=state.tournaments.find(x=>x.id===id); if(t) copyText(summary(t)); return;}
  if(act==='del'){const t=state.tournaments.find(x=>x.id===id); if(!t) return;
    openSheet(`<h2>Delete this tournament?</h2><p class="help" style="font-size:17px">“${esc(t.name||'This tournament')}” (${esc(fmtRange(t.start,t.end))}) will be removed from the hub for everyone. This can’t be undone.</p><div class="bar"><button class="btn ghost" data-act="close">Cancel</button><button class="btn danger" data-act="del-yes" data-id="${esc(id)}">Delete</button></div>`); return;}
  if(act==='del-yes'){const next=JSON.parse(JSON.stringify(state)); next.tournaments=next.tournaments.filter(x=>x.id!==id);
    if(await persist(next)){closeSheet(); location.hash=lastHome&&!lastHome.startsWith('#t/')?lastHome:'#home'; render(); toast('Deleted.');} return;}
  if(act==='save-t'){const f=readForm(); if(!f.name){toast('Add a tournament name first.');return;}
    if(f.start&&f.end&&f.end<f.start){toast('End date is before the start date.');return;}
    const next=JSON.parse(JSON.stringify(state)); const tid=id||uid();
    const rec={id:tid,name:f.name,start:f.start,end:f.end||f.start,city:f.city,trip:f.trip,confirmed:f.confirmed,division:f.division,info:f.info,schedChecked:f.schedChecked||'',site:f.site,plans:readPlans(),groupme:f.groupme,groupHotel:f.groupHotel,clips:f.clips,playlist:f.playlist,statsnerd:f.statsnerd,played:f.played,hotels:f.hotels,venues:f.venues,games:f.games,travelTab:f.travelTab,checklist:f.checklist,chkTpl:f.chkTpl,notes:f.notes};
    const i=next.tournaments.findIndex(x=>x.id===tid); if(i>=0) next.tournaments[i]=rec; else next.tournaments.push(rec);
    try{sessionStorage.setItem('hub-open',tid);}catch(err){}
    if(await persist(next)){closeSheet();location.hash='#t/'+tid;render();toast('Published.');}
    return;}
  if(act==='save-s'){const f=readForm(); const next=JSON.parse(JSON.stringify(state));
    next.team={name:f.tname||'Our Team',label:f.tlabel,season:f.season}; next.roster=(f.roster||'').split(',').map(x=>x.trim()).filter(Boolean); next.links={leagueapps:f.leagueapps,groupme:f.groupme,whatsapp:f.whatsapp,youtube:f.youtube,photos:f.photos,travelSheet:f.travelSheet,travelSynced:state.links.travelSynced||''};
    if(await persist(next)){closeSheet();render();toast('Published.');}
    return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet) closeSheet();});
document.addEventListener('change',e=>{const c=e.target.closest('[data-chk]'); if(!c) return; try{localStorage.setItem(c.dataset.chk,c.checked?'1':'0');}catch(err){} const box=c.closest('.chk'); c.closest('.chki').classList.toggle('done',c.checked); if(box){const all=box.querySelectorAll('[data-chk]'); const n=[...all].filter(x=>x.checked).length; box.querySelector('.chkh small').textContent=n+' of '+all.length+' done';}});

try{const o=sessionStorage.getItem('hub-open'); if(o){sessionStorage.removeItem('hub-open'); if(!location.hash) location.hash='#t/'+o;}}catch(e){}
render();

(async()=>{
  if(!window.claude||typeof window.claude.use!=='function') return;
  try{ artifactNs=await window.claude.use('artifact'); }catch(e){ artifactNs=null; }
  if(!artifactNs){render();return;}
  let u=null; try{ u=await window.claude.use('user'); }catch(e){}
  if(u){ try{ const [ce,own]=await Promise.all([u.canEdit?u.canEdit():false,u.isOwner?u.isOwner():false]); canEdit=!!(ce||own); }catch(e){} }
  render();
})();
/* Parent site: read-only. Travel times load live from the team Google Sheet. */

  let hide=false; try{hide=localStorage.getItem('hub-a2hs')==='1';}catch(e){}
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  if(hide||standalone||window.innerWidth>760) return '';
  return `<div class="a2hs a2hs-card"><div class="a2top"><img class="a2icon" src="apple-touch-icon.png" alt="" width="64" height="64"><div class="a2txt"><b>Put the Team Hub on your Home Screen</b><span>It opens like an app, with the Swish icon.</span></div></div>
  <details class="a2how"><summary>Show me how</summary>
    <p class="a2h">iPhone (Safari)</p><ol><li>Tap the Share button.</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>
    <p class="a2h">Android (Chrome)</p><ol><li>Tap the menu (⋮).</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b>.</li></ol>
  </details><button data-act="a2hs">Got it</button></div>`;
}
(function(){
  const sh=(state.links&&state.links.travelSheet)||''; const m=sh.match(/\/d\/([A-Za-z0-9_-]+)/); if(!m) return;
  const id=m[1];
  function parseCSV(txt){const rows=[];let row=[],f='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true; else if(c===','){row.push(f);f='';} else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';} else if(c!=='\r') f+=c;}
    if(f||row.length){row.push(f);rows.push(row);} return rows;}
  const how=x=>/fly|flight|plane/i.test(x)?'fly':/driv|car/i.test(x)?'drive':'';
  const tgt=(state.tournaments||[]).filter(t=>t.trip==='travel'&&t.travelGid&&(function(){try{return status(t).k!=='past';}catch(e){return true;}})());
  if(!tgt.length) return;
  let ok=0;
  Promise.all(tgt.map(t=>fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=0&gid=${t.travelGid}&range=A5:E60`,{cache:'no-store'})
    .then(r=>{if(!r.ok) throw 0; return r.text();})
    .then(txt=>{const plans={}; parseCSV(txt).forEach(r=>{const n=(r[0]||'').trim(); if(!n||/^player$/i.test(n)) return;
        const x={arr:(r[1]||'').trim(),dep:(r[2]||'').trim(),how:how(r[3]||''),note:(r[4]||'').trim()};
        Object.keys(x).forEach(k=>{if(!x[k]) delete x[k];}); if(Object.keys(x).length) plans[n]=x;});
      t.plans=plans; ok++;})
    .catch(()=>{}))).then(()=>{ if(!ok) return;
      const d=new Date(); state.links.travelLive=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
      try{render();}catch(e){} });
})();
})();
