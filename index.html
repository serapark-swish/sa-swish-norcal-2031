<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swish Team Hub</title>
<meta name="apple-mobile-web-app-title" content="Swish Hub">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D0D0F">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#0D0D0F;color:#ECEEF2;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .boot{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;box-sizing:border-box}
  .boot img{width:96px;height:96px;border-radius:22px}
  .boot p{color:#9CA3B0;margin:0}
  .boot a{color:#E2AE5E}
</style>
</head>
<body>
<div class="boot"><img src="apple-touch-icon.png" alt=""><p id="msg">Loading the Team Hub…</p></div>
<script>
/* Swish Team Hub, parent site.
   The hub is maintained in Claude. Every save there writes the latest version
   to the "_hub_site" tab of the team Google Sheet, and this page loads it.
   Nothing here needs to change when the hub changes. */
window.__SWISH_PARENT__ = true;
var SHEET = "1fFVU18DYGFk3npgPyqJQRuo4isyvEu1O_ZY0aCr4L-o";
var TAB_GID = "1248067865";
var CACHE = "swish-hub-html";
var HEAD_EXTRA = '<meta name="apple-mobile-web-app-title" content="Swish Hub">' +
  '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">' +
  '<meta name="theme-color" content="#0D0D0F"><link rel="apple-touch-icon" href="apple-touch-icon.png">' +
  '<link rel="icon" type="image/png" href="favicon.png"><link rel="manifest" href="manifest.webmanifest">';
function parseCSV(txt){var rows=[],row=[],f='',q=false;for(var i=0;i<txt.length;i++){var c=txt[i];
  if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"')q=true; else if(c===','){row.push(f);f='';} else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';} else if(c!=='\r') f+=c;}
  if(f||row.length){row.push(f);rows.push(row);} return rows;}
function show(html){
  html = html.replace(/<\/title>/i, '</title>' + HEAD_EXTRA);
  document.open(); document.write(html); document.close();
}
function fallback(){
  var c=null; try{c=localStorage.getItem(CACHE);}catch(e){}
  if(c){ show(c); return; }
  document.getElementById('msg').innerHTML='Couldn’t load the Team Hub. Check your connection and <a href="">try again</a>.';
}
var ctrl = window.AbortController ? new AbortController() : null;
var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 8000);
fetch('https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:csv&headers=0&gid='+TAB_GID+'&range=A1:A9&t='+Date.now(), {cache:'no-store', signal: ctrl ? ctrl.signal : undefined})
  .then(function(r){ if(!r.ok) throw new Error('http'); return r.text(); })
  .then(function(txt){
    clearTimeout(timer);
    var rows=parseCSV(txt), head=((rows[0]||[])[0]||'').split('|'), n=parseInt(head[2],10)||0, html='';
    for(var i=1;i<=n;i++){ html += ((rows[i]||[])[0]||'').replace(/^\|/,''); }
    if(!/^<!doctype html>/i.test(html) || html.indexOf('</html>')<0) throw new Error('incomplete');
    try{ localStorage.setItem(CACHE, html); }catch(e){}
    show(html);
  })
  .catch(function(){ clearTimeout(timer); fallback(); });
</script>
</body>
</html>
